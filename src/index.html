<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Notes App sederhana untuk mencatat, mengarsipkan, dan menghapus catatan."
    />
    <title>Notes App</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f72af'/%3E%3Ctext x='32' y='46' font-family='Poppins,Arial,sans-serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-bar heading="Notes App" subtitle="Catat semua idemu, kapan pun dan di mana pun."></app-bar>

    <main class="container">
      <section class="panel panel--form" aria-labelledby="form-title">
        <h2 id="form-title">Tambah Catatan</h2>
        <note-form max-title="50"></note-form>
      </section>

      <div class="notes-column">
        <section class="panel" aria-labelledby="active-title">
          <div class="panel__header">
            <div class="panel__heading">
              <h2 id="active-title">Catatan Aktif</h2>
              <span class="count-badge" id="active-count" aria-label="Jumlah catatan aktif">0</span>
            </div>
            <button type="button" class="btn-ghost" id="refresh-button">Muat ulang</button>
          </div>
          <note-list
            id="active-list"
            empty-text="Belum ada catatan. Yuk, tulis catatan pertamamu!"
          ></note-list>
        </section>

        <section class="panel" aria-labelledby="archive-title">
          <div class="panel__header">
            <div class="panel__heading">
              <h2 id="archive-title">Arsip</h2>
              <span class="count-badge" id="archive-count" aria-label="Jumlah catatan diarsipkan"
                >0</span
              >
            </div>
          </div>
          <note-list id="archived-list" empty-text="Belum ada catatan yang diarsipkan."></note-list>
        </section>
      </div>
    </main>

    <footer class="footer">Notes App &middot; Terintegrasi dengan Dicoding Notes API v2</footer>

    <loading-indicator id="app-loading"></loading-indicator>
    <feedback-toast id="app-toast"></feedback-toast>
    <confirm-dialog id="app-confirm"></confirm-dialog>

    <noscript>
      <p class="noscript">Aplikasi ini membutuhkan JavaScript untuk berjalan.</p>
    </noscript>
  </body>
</html>
